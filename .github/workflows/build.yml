name: Build WireShield Android App

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 'current'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to apks Folder
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/WireShield-VPN-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk apks/app-debug.apk
          echo "Listing generated APKs in apks/:"
          ls -lh apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireShield-VPN-APKs
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases (Visible on Repo Page)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "WireShield VPN v1.0.0"
          files: |
            apks/WireShield-VPN-debug.apk
            apks/app-debug.apk
            apks/README.md
          body: |
            # WireShield VPN v1.0.0 (Prebuilt Release)

            Prebuilt installable APK package with WireGuard® encryption, Network Drop Watchdog, and Kill Switch.

            ### 📦 Download:
            * **[WireShield-VPN-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/WireShield-VPN-debug.apk)** (~23.3 MB)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
